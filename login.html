<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso à Conta | Login & Registo</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.94);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-gradient: linear-gradient(135deg, #4338ca 0%, #7c3aed 50%, #db2777 100%);
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 2rem 1.25rem;
        }

        /* Ambient Pastel Lighting */
        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(168, 85, 247, 0.08) 40%, transparent 70%);
            filter: blur(80px);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            pointer-events: none;
            z-index: 1;
        }

        .ambient-glow-2 {
            position: fixed;
            bottom: -100px;
            right: -100px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, rgba(99, 102, 241, 0.08) 50%, transparent 70%);
            filter: blur(80px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        /* Top Back Link */
        .back-link {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.25s ease;
            z-index: 20;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .back-link:hover {
            color: var(--primary);
            background: #ffffff;
            transform: translateX(-3px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.15);
        }

        .back-link svg {
            width: 18px;
            height: 18px;
        }

        /* Auth Container Card */
        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 28px;
            padding: 2.75rem 2.25rem;
            box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.09),
                        0 8px 24px -4px rgba(15, 23, 42, 0.03);
            transition: transform 0.3s ease;
        }

        /* Header Brand */
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--primary-gradient);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            color: #ffffff;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .auth-logo svg {
            width: 28px;
            height: 28px;
        }

        .auth-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
        }

        .auth-header p {
            font-size: 0.925rem;
            color: var(--text-secondary);
        }

        /* Tab Switcher */
        .tab-wrapper {
            display: flex;
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 1.75rem;
            position: relative;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            font-size: 0.925rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--primary);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        /* Forms */
        .form-section {
            display: none;
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .input-icon svg {
            width: 19px;
            height: 19px;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-main);
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 2px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        .toggle-password svg {
            width: 19px;
            height: 19px;
        }

        /* Password Strength Meter */
        .strength-container {
            margin-top: 8px;
        }

        .strength-bar {
            height: 4px;
            width: 100%;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            display: flex;
            gap: 4px;
        }

        .strength-segment {
            flex: 1;
            height: 100%;
            background: #e2e8f0;
            transition: background-color 0.3s ease;
        }

        .strength-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
            display: block;
        }

        /* Checkbox & Forgot Password */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 13px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            color: #ffffff;
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -5px rgba(99, 102, 241, 0.5);
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        /* Social Auth Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 1.75rem 0 1.25rem;
            color: #94a3b8;
            font-size: 0.825rem;
            font-weight: 500;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        /* Social Buttons */
        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Toast Alert */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.4rem;
            border-radius: 14px;
            background: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 0.925rem;
            font-weight: 500;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .toast.success {
            border-left: 5px solid var(--success);
        }

        .toast.error {
            border-left: 5px solid var(--error);
        }

        .toast-icon {
            display: flex;
            align-items: center;
        }

        .toast.success .toast-icon { color: var(--success); }
        .toast.error .toast-icon { color: var(--error); }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <a href="index.html" class="back-link">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Início
    </a>

    <a href="admin.html" class="back-link" style="left: auto; right: 1.5rem;">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
        Painel Admin
    </a>

    <main class="auth-card">
        <!-- Brand Header -->
        <header class="auth-header">
            <div class="auth-logo">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 id="auth-title">Bem-vindo de volta</h1>
            <p id="auth-subtitle">Introduza as suas credenciais para aceder ao sistema</p>
        </header>

        <!-- Tab Switcher -->
        <div class="tab-wrapper" role="tablist">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Entrar</button>
            <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Criar Conta</button>
        </div>

        <!-- LOGIN FORM -->
        <section class="form-section active" id="login-section">
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="login-email">E-mail</label>
                    <div class="input-field-wrapper">
                        <span class="input-icon">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
                            </svg>
                        </span>
                        <input type="email" id="login-email" class="input-field" placeholder="exemplo@dominio.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="login-password">Senha</label>
                    <div class="input-field-wrapper">
                        <span class="input-icon">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                        <input type="password" id="login-password" class="input-field" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('login-password')">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me">
                        Lembrar-me
                    </label>
                    <a href="#" class="forgot-link" onclick="showToast('Link de recuperação enviado para o seu e-mail!', 'success'); return false;">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Aceder à Conta</span>
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </form>
        </section>

        <!-- REGISTER FORM -->
        <section class="form-section" id="register-section">
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label for="reg-name">Nome Completo</label>
                    <div class="input-field-wrapper">
                        <span class="input-icon">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </span>
                        <input type="text" id="reg-name" class="input-field" placeholder="Afonso Domingos" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-email">E-mail</label>
                    <div class="input-field-wrapper">
                        <span class="input-icon">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
                            </svg>
                        </span>
                        <input type="email" id="reg-email" class="input-field" placeholder="exemplo@dominio.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-password">Criar Senha</label>
                    <div class="input-field-wrapper">
                        <span class="input-icon">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                        <input type="password" id="reg-password" class="input-field" placeholder="Pelo menos 8 caracteres" oninput="checkPasswordStrength(this.value)" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('reg-password')">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                    <div class="strength-container">
                        <div class="strength-bar">
                            <div class="strength-segment" id="strength-1"></div>
                            <div class="strength-segment" id="strength-2"></div>
                            <div class="strength-segment" id="strength-3"></div>
                        </div>
                        <span class="strength-text" id="strength-label">Força da senha: Digite uma senha</span>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" required>
                        Concordo com os Termos e Privacidade
                    </label>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Criar Minha Conta</span>
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                    </svg>
                </button>
            </form>
        </section>

        <!-- Social Auth Divider -->
        <div class="divider">ou continue com</div>

        <!-- Social Buttons -->
        <div class="social-grid">
            <button type="button" class="social-btn" onclick="showToast('Conexão com Google em processamento...', 'success')">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                </svg>
                Google
            </button>
            <button type="button" class="social-btn" onclick="showToast('Conexão com GitHub em processamento...', 'success')">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                </svg>
                GitHub
            </button>
        </div>
    </main>

    <!-- Notification Toast -->
    <div class="toast" id="toast">
        <div class="toast-icon" id="toast-icon">
            <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <span id="toast-message">Notificação</span>
    </div>

    <script>
        // Tab switching logic
        function switchTab(tab) {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const loginSec = document.getElementById('login-section');
            const registerSec = document.getElementById('register-section');
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');

            if (tab === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                loginSec.classList.add('active');
                registerSec.classList.remove('active');
                title.textContent = 'Bem-vindo de volta';
                subtitle.textContent = 'Introduza as suas credenciais para aceder ao sistema';
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                registerSec.classList.add('active');
                loginSec.classList.remove('active');
                title.textContent = 'Criar nova conta';
                subtitle.textContent = 'Junte-se a nós preenchendo os dados abaixo';
            }
        }

        // Toggle Password Show/Hide
        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        // Check Password Strength
        function checkPasswordStrength(password) {
            const s1 = document.getElementById('strength-1');
            const s2 = document.getElementById('strength-2');
            const s3 = document.getElementById('strength-3');
            const label = document.getElementById('strength-label');

            s1.style.backgroundColor = '#e2e8f0';
            s2.style.backgroundColor = '#e2e8f0';
            s3.style.backgroundColor = '#e2e8f0';

            if (!password) {
                label.textContent = 'Força da senha: Digite uma senha';
                label.style.color = 'var(--text-secondary)';
                return;
            }

            let score = 0;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password) && /[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            if (score === 1) {
                s1.style.backgroundColor = '#ef4444';
                label.textContent = 'Força da senha: Fraca';
                label.style.color = '#ef4444';
            } else if (score === 2) {
                s1.style.backgroundColor = '#f59e0b';
                s2.style.backgroundColor = '#f59e0b';
                label.textContent = 'Força da senha: Média';
                label.style.color = '#f59e0b';
            } else if (score >= 3) {
                s1.style.backgroundColor = '#10b981';
                s2.style.backgroundColor = '#10b981';
                s3.style.backgroundColor = '#10b981';
                label.textContent = 'Força da senha: Forte ✨';
                label.style.color = '#10b981';
            }
        }

        // Toast feedback
        let toastTimeout;
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toast-message');
            const iconDiv = document.getElementById('toast-icon');

            msgSpan.textContent = message;
            toast.className = `toast ${type} show`;

            if (type === 'success') {
                iconDiv.innerHTML = `<svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>`;
            } else {
                iconDiv.innerHTML = `<svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>`;
            }

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // Form Submit Handlers
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            if (email.toLowerCase().includes('admin')) {
                showToast(`Sessão de Administrador iniciada! A abrir painel...`, 'success');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1400);
            } else {
                showToast(`Bem-vindo, ${email.split('@')[0]}! Sessão iniciada.`, 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1600);
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;

            // Save to localStorage app_users so it displays dynamically in admin.html
            try {
                const stored = localStorage.getItem('app_users');
                let usersList = stored ? JSON.parse(stored) : [];
                usersList.unshift({
                    id: Date.now(),
                    name: name,
                    email: email,
                    role: "Utilizador",
                    status: "Ativo",
                    date: new Date().toISOString().split('T')[0]
                });
                localStorage.setItem('app_users', JSON.stringify(usersList));
            } catch (err) {
                console.error(err);
            }

            showToast(`Conta criada para ${name}! Registado no sistema.`, 'success');
            setTimeout(() => {
                switchTab('login');
            }, 1800);
        }
    </script>
</body>
</html>
